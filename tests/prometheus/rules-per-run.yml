# Generated by RunSignal from workload manifests. Do not edit: regenerate with `runsignal export prometheus`.
groups:
  - name: 'runsignal-reports'
    rules:
      - alert: RunSignalMissed
        expr: 'absent_over_time(runsignal_workload_runs_total{job="reports", runsignal_workload="hourly-export", runsignal_outcome="success"}[4200s]) and on (job, runsignal_workload) max by (job, runsignal_workload) (max_over_time(runsignal_workload_runs_total{job="reports", runsignal_workload="hourly-export", runsignal_outcome="success"}[16800s]))'
        for: 0s
        labels:
          severity: critical
          runsignal_alert: missed
          runsignal_workload: 'hourly-export'
        annotations:
          summary: 'reports/hourly-export: missed'
          description: 'hourly-export has not succeeded for longer than its schedule (0 * * * *) allows: 1h between runs plus 10m grace.'
      - alert: RunSignalFailed
        expr: 'sum by (job, runsignal_workload) (max_over_time(runsignal_workload_runs_total{job="reports", runsignal_workload="hourly-export", runsignal_outcome="failure"}[5m])) > 0'
        for: 0s
        labels:
          severity: critical
          runsignal_alert: failed
          runsignal_workload: 'hourly-export'
        annotations:
          summary: 'reports/hourly-export: failed'
          description: 'A run of hourly-export failed.'
      - alert: RunSignalOverrun
        expr: 'sum by (job, runsignal_workload) (max_over_time(runsignal_workload_duration_seconds_bucket{job="reports", runsignal_workload="hourly-export", le="+Inf"}[5m])) - sum by (job, runsignal_workload) (max_over_time(runsignal_workload_duration_seconds_bucket{job="reports", runsignal_workload="hourly-export", le="600"}[5m])) > 0'
        for: 0s
        labels:
          severity: critical
          runsignal_alert: overrun
          runsignal_workload: 'hourly-export'
        annotations:
          summary: 'reports/hourly-export: overrun'
          description: 'A run of hourly-export took longer than 10m (limit 10m, rounded up to a histogram bucket).'
      - alert: RunSignalHung
        expr: 'max by (job, runsignal_workload) (runsignal_workload_active_run_age_seconds{job="reports", runsignal_workload="hourly-export"}) > 600'
        for: 1m
        labels:
          severity: critical
          runsignal_alert: hung
          runsignal_workload: 'hourly-export'
        annotations:
          summary: 'reports/hourly-export: hung'
          description: 'A run of hourly-export has been running for longer than 10m and has not finished: it may be hung, or the code never ends the run.'
      - alert: RunSignalLowOutput
        expr: 'sum by (job, runsignal_workload) (max_over_time(runsignal_workload_items_total{job="reports", runsignal_workload="hourly-export", runsignal_item_result="processed"}[1h])) / sum by (job, runsignal_workload) (max_over_time(runsignal_workload_runs_total{job="reports", runsignal_workload="hourly-export", runsignal_outcome="success"}[1h])) < 10'
        for: 0s
        labels:
          severity: critical
          runsignal_alert: low-output
          runsignal_workload: 'hourly-export'
        annotations:
          summary: 'reports/hourly-export: low-output'
          description: 'Successful runs of hourly-export processed fewer than 10 items on average in the last hour.'
