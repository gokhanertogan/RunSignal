# Generated by RunSignal from workload manifests. Do not edit: regenerate with `runsignal export prometheus`.
groups:
  - name: 'runsignal-billing'
    rules:
      - alert: RunSignalMissed
        expr: 'max by (job, runsignal_workload) (runsignal_workload_since_success_seconds{job="billing", runsignal_workload="nightly-invoice"}) > 88200'
        for: 1m
        labels:
          severity: critical
          runsignal_alert: missed
          runsignal_workload: 'nightly-invoice'
        annotations:
          summary: 'billing/nightly-invoice: missed'
          description: 'nightly-invoice has not succeeded for longer than its schedule (0 2 * * *) allows: 1d between runs plus 30m grace.'
      - alert: RunSignalNotReporting
        expr: 'absent_over_time(runsignal_workload_since_success_seconds{job="billing", runsignal_workload="nightly-invoice"}[15m])'
        for: 0s
        labels:
          severity: critical
          runsignal_alert: not-reporting
          runsignal_workload: 'nightly-invoice'
        annotations:
          summary: 'billing/nightly-invoice: not-reporting'
          description: 'nightly-invoice has reported nothing for 15m: the service is down or not exporting.'
      - alert: RunSignalFailed
        expr: 'sum by (job, runsignal_workload) (increase(runsignal_workload_runs_total{job="billing", runsignal_workload="nightly-invoice", runsignal_outcome="failure"}[5m])) > 0 or sum by (job, runsignal_workload) (runsignal_workload_runs_total{job="billing", runsignal_workload="nightly-invoice", runsignal_outcome="failure"} unless runsignal_workload_runs_total{job="billing", runsignal_workload="nightly-invoice", runsignal_outcome="failure"} offset 5m) > 0'
        for: 0s
        labels:
          severity: critical
          runsignal_alert: failed
          runsignal_workload: 'nightly-invoice'
        annotations:
          summary: 'billing/nightly-invoice: failed'
          description: 'A run of nightly-invoice failed.'
      - alert: RunSignalOverrun
        expr: 'sum by (job, runsignal_workload) (increase(runsignal_workload_duration_seconds_bucket{job="billing", runsignal_workload="nightly-invoice", le="+Inf"}[5m])) - sum by (job, runsignal_workload) (increase(runsignal_workload_duration_seconds_bucket{job="billing", runsignal_workload="nightly-invoice", le="1800"}[5m])) > 0'
        for: 0s
        labels:
          severity: critical
          runsignal_alert: overrun
          runsignal_workload: 'nightly-invoice'
        annotations:
          summary: 'billing/nightly-invoice: overrun'
          description: 'A run of nightly-invoice took longer than 30m (limit 30m, rounded up to a histogram bucket).'
      - alert: RunSignalLowOutput
        expr: 'sum by (job, runsignal_workload) (increase(runsignal_workload_items_total{job="billing", runsignal_workload="nightly-invoice", runsignal_item_result="processed"}[1h])) / sum by (job, runsignal_workload) (increase(runsignal_workload_runs_total{job="billing", runsignal_workload="nightly-invoice", runsignal_outcome="success"}[1h])) < 100'
        for: 0s
        labels:
          severity: critical
          runsignal_alert: low-output
          runsignal_workload: 'nightly-invoice'
        annotations:
          summary: 'billing/nightly-invoice: low-output'
          description: 'Successful runs of nightly-invoice processed fewer than 100 items on average in the last hour.'
      - alert: RunSignalStalled
        expr: 'max by (job, runsignal_workload) (runsignal_workload_since_heartbeat_seconds{job="billing", runsignal_workload="stock-sync"}) > 300'
        for: 1m
        labels:
          severity: warning
          runsignal_alert: stalled
          runsignal_workload: 'stock-sync'
        annotations:
          summary: 'billing/stock-sync: stalled'
          description: 'stock-sync has not sent a heartbeat for longer than 5m.'
      - alert: RunSignalNotReporting
        expr: 'absent_over_time(runsignal_workload_since_heartbeat_seconds{job="billing", runsignal_workload="stock-sync"}[15m])'
        for: 0s
        labels:
          severity: warning
          runsignal_alert: not-reporting
          runsignal_workload: 'stock-sync'
        annotations:
          summary: 'billing/stock-sync: not-reporting'
          description: 'stock-sync has reported nothing for 15m: the service is down or not exporting.'
      - alert: RunSignalFailureRate
        expr: 'sum by (job, runsignal_workload) (increase(runsignal_workload_runs_total{job="billing", runsignal_workload="stock-sync", runsignal_outcome="failure"}[15m])) / sum by (job, runsignal_workload) (increase(runsignal_workload_runs_total{job="billing", runsignal_workload="stock-sync", runsignal_outcome=~"success|failure"}[15m])) > 0.2'
        for: 0s
        labels:
          severity: warning
          runsignal_alert: failure-rate
          runsignal_workload: 'stock-sync'
        annotations:
          summary: 'billing/stock-sync: failure-rate'
          description: 'More than 20% of the runs of stock-sync failed in the last 15 minutes.'
      - alert: RunSignalItemFailureRate
        expr: 'sum by (job, runsignal_workload) (increase(runsignal_workload_items_total{job="billing", runsignal_workload="stock-sync", runsignal_item_result="failed"}[15m])) / sum by (job, runsignal_workload) (increase(runsignal_workload_items_total{job="billing", runsignal_workload="stock-sync"}[15m])) > 0.2'
        for: 0s
        labels:
          severity: warning
          runsignal_alert: item-failure-rate
          runsignal_workload: 'stock-sync'
        annotations:
          summary: 'billing/stock-sync: item-failure-rate'
          description: 'More than 20% of the items stock-sync handled failed in the last 15 minutes.'
