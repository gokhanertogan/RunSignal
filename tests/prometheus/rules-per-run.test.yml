# promtool test rules tests/prometheus/rules-per-run.test.yml
# Per-run workloads (runsignal exec, Kubernetes CronJobs): every run is its own process and exports its own series
# (a new service.instance.id becomes the instance label), so each series holds one run and then goes silent.
rule_files:
  - rules-per-run.yml

evaluation_interval: 1m

tests:
  # Missed: one successful run, then none. Hourly plus 10 minutes of grace is 4200 seconds (70 minutes).
  # Silence between runs is normal, so nothing fires before that.
  - interval: 1m
    input_series:
      - series: 'runsignal_workload_runs_total{job="reports", runsignal_workload="hourly-export", runsignal_outcome="success", instance="run-1"}'
        values: '1 1 1'
    alert_rule_test:
      - eval_time: 60m
        alertname: RunSignalMissed
        exp_alerts: []
      - eval_time: 75m
        alertname: RunSignalMissed
        exp_alerts:
          - exp_labels: { job: reports, runsignal_workload: hourly-export, runsignal_outcome: success, severity: critical, runsignal_alert: missed }
            exp_annotations:
              summary: 'reports/hourly-export: missed'
              description: 'hourly-export has not succeeded for longer than its schedule (0 * * * *) allows: 1h between runs plus 10m grace.'

  # A workload whose rule loads before its first run has never succeeded: that is not a missed run. Only failures
  # so far do not count either.
  - interval: 1m
    input_series:
      - series: 'runsignal_workload_runs_total{job="reports", runsignal_workload="hourly-export", runsignal_outcome="failure", error_type="exit_code_1", instance="run-0"}'
        values: '1 1'
    alert_rule_test:
      - eval_time: 90m
        alertname: RunSignalMissed
        exp_alerts: []

  # Retired: four gaps (280 minutes) after the last success, the workload no longer counts as expected to run.
  - interval: 1m
    input_series:
      - series: 'runsignal_workload_runs_total{job="reports", runsignal_workload="hourly-export", runsignal_outcome="success", instance="run-1"}'
        values: '1 1 1'
    alert_rule_test:
      - eval_time: 270m
        alertname: RunSignalMissed
        exp_alerts:
          - exp_labels: { job: reports, runsignal_workload: hourly-export, runsignal_outcome: success, severity: critical, runsignal_alert: missed }
            exp_annotations:
              summary: 'reports/hourly-export: missed'
              description: 'hourly-export has not succeeded for longer than its schedule (0 * * * *) allows: 1h between runs plus 10m grace.'
      - eval_time: 290m
        alertname: RunSignalMissed
        exp_alerts: []

  # A run that has started reports nothing about success yet, but its next run keeps the alert quiet.
  - interval: 1m
    input_series:
      - series: 'runsignal_workload_runs_total{job="reports", runsignal_workload="hourly-export", runsignal_outcome="success", instance="run-1"}'
        values: '1 1'
      - series: 'runsignal_workload_runs_total{job="reports", runsignal_workload="hourly-export", runsignal_outcome="success", instance="run-2"}'
        values: '_x60 1 1'
    alert_rule_test:
      - eval_time: 100m
        alertname: RunSignalMissed
        exp_alerts: []

  # Failed: a run's own series starts at 1, which increase() could never see.
  - interval: 1m
    input_series:
      - series: 'runsignal_workload_runs_total{job="reports", runsignal_workload="hourly-export", runsignal_outcome="failure", error_type="exit_code_2", instance="run-3"}'
        values: '_ 1 1'
    alert_rule_test:
      - eval_time: 0m
        alertname: RunSignalFailed
        exp_alerts: []
      - eval_time: 2m
        alertname: RunSignalFailed
        exp_alerts:
          - exp_labels: { job: reports, runsignal_workload: hourly-export, severity: critical, runsignal_alert: failed }
            exp_annotations:
              summary: 'reports/hourly-export: failed'
              description: 'A run of hourly-export failed.'
      - eval_time: 10m
        alertname: RunSignalFailed
        exp_alerts: []

  # Low output: two runs processed 3 and 4 items, 3.5 on average against a minimum of 10.
  - interval: 1m
    input_series:
      - series: 'runsignal_workload_items_total{job="reports", runsignal_workload="hourly-export", runsignal_item_result="processed", instance="run-4"}'
        values: '3 3'
      - series: 'runsignal_workload_runs_total{job="reports", runsignal_workload="hourly-export", runsignal_outcome="success", instance="run-4"}'
        values: '1 1'
      - series: 'runsignal_workload_items_total{job="reports", runsignal_workload="hourly-export", runsignal_item_result="processed", instance="run-5"}'
        values: '_ _ 4 4'
      - series: 'runsignal_workload_runs_total{job="reports", runsignal_workload="hourly-export", runsignal_outcome="success", instance="run-5"}'
        values: '_ _ 1 1'
    alert_rule_test:
      - eval_time: 4m
        alertname: RunSignalLowOutput
        exp_alerts:
          - exp_labels: { job: reports, runsignal_workload: hourly-export, severity: critical, runsignal_alert: low-output }
            exp_annotations:
              summary: 'reports/hourly-export: low-output'
              description: 'Successful runs of hourly-export processed fewer than 10 items on average in the last hour.'

  # Overrun: one run took 20 minutes against a 10-minute limit.
  - interval: 1m
    input_series:
      - series: 'runsignal_workload_duration_seconds_bucket{job="reports", runsignal_workload="hourly-export", le="600", instance="run-6"}'
        values: '0 0'
      - series: 'runsignal_workload_duration_seconds_bucket{job="reports", runsignal_workload="hourly-export", le="+Inf", instance="run-6"}'
        values: '1 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: RunSignalOverrun
        exp_alerts:
          - exp_labels: { job: reports, runsignal_workload: hourly-export, severity: critical, runsignal_alert: overrun }
            exp_annotations:
              summary: 'reports/hourly-export: overrun'
              description: 'A run of hourly-export took longer than 10m (limit 10m, rounded up to a histogram bucket).'
