name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet test -c Release
      - run: |
          dotnet pack src/RunSignal.Core -c Release -o artifacts
          dotnet pack src/RunSignal.DotNet -c Release -o artifacts
          dotnet pack src/RunSignal.OpenTelemetry -c Release -o artifacts
          dotnet pack src/RunSignal.Hangfire -c Release -o artifacts
          dotnet pack src/RunSignal.Quartz -c Release -o artifacts
          dotnet pack src/RunSignal.NewRelic -c Release -o artifacts
          dotnet pack src/RunSignal.Cli -c Release -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/RunSignal.Go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/RunSignal.Go/go.mod
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test -race ./...
      - run: cd examples/worker && go build .

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/RunSignal.Node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y redis-server   # the BullMQ tests start their own instance
      - run: npm ci
      - run: npm test

  java:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        spring-boot: ['3.2.12', '3.5.16', '4.1.2']
    defaults:
      run:
        working-directory: src/RunSignal.Java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: mvn -B install -Dspring-boot.version=${{ matrix.spring-boot }}
