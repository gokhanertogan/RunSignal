name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli-native:
    name: CLI native binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          file: src/RunSignal.Cli/Dockerfile
          tags: runsignal:ci
          load: true
      # The oldest glibc the binary promises (Debian 10, glibc 2.28), and Alpine for the musl one. The command's
      # exit code must come back unchanged.
      - name: Run it where users will
        run: |
          id=$(docker create runsignal:ci)
          docker cp "$id:/runsignal" ./runsignal && docker cp "$id:/runsignal-musl" ./runsignal-musl && docker rm "$id"
          check() {
            code=0
            docker run --rm -v "$PWD/$1:/rs:ro" "$2" /rs exec -w ci --service ci -- sh -c 'exit 7' || code=$?
            echo "$1 on $2: exit $code"
            test "$code" = 7
          }
          check runsignal debian:10-slim
          check runsignal-musl alpine:3.22

  cli-native-desktop:
    name: CLI native binary (${{ matrix.rid }})
    strategy:
      matrix:
        include:
          - { rid: osx-arm64, runner: macos-15 }
          - { rid: win-x64, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish src/RunSignal.Cli -c Release -r ${{ matrix.rid }} -p:RunSignalNative=true -o out
      - run: ./out/runsignal exec -w ci --service ci -- dotnet --version
        shell: bash

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet test -c Release
      - name: Check the Prometheus rules with promtool
        run: |
          curl -fsSL --retry 3 https://github.com/prometheus/prometheus/releases/download/v3.15.1/prometheus-3.15.1.linux-amd64.tar.gz | tar xz
          prometheus-3.15.1.linux-amd64/promtool test rules tests/prometheus/rules.test.yml tests/prometheus/rules-per-run.test.yml
      - run: |
          dotnet pack src/RunSignal.Core -c Release -o artifacts
          dotnet pack src/RunSignal.DotNet -c Release -o artifacts
          dotnet pack src/RunSignal.OpenTelemetry -c Release -o artifacts
          dotnet pack src/RunSignal.Hangfire -c Release -o artifacts
          dotnet pack src/RunSignal.Quartz -c Release -o artifacts
          dotnet pack src/RunSignal.Quartz4 -c Release -o artifacts
          dotnet pack src/RunSignal.Alerting -c Release -o artifacts
          dotnet pack src/RunSignal.NewRelic -c Release -o artifacts
          dotnet pack src/RunSignal.Prometheus -c Release -o artifacts
          dotnet pack src/RunSignal.Cli -c Release -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test -race ./...
      - run: cd examples/worker && go build .

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/RunSignal.Node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y redis-server   # the BullMQ tests start their own instance
      - run: npm ci
      - run: npm test

  java:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { spring-boot: '3.2.12', batch: '5' }
          - { spring-boot: '3.5.16', batch: '5' }
          - { spring-boot: '4.1.2', batch: '6' }
    defaults:
      run:
        working-directory: src/RunSignal.Java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: mvn -B install -Dspring-boot.version=${{ matrix.spring-boot }} -Dbatch=${{ matrix.batch }}

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    defaults:
      run:
        working-directory: src/RunSignal.Python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[celery,apscheduler]" opentelemetry-sdk pytest build
      - run: pytest
      - run: python -m build

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/RunSignal.Rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
