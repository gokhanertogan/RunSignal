name: CLI release

# The runsignal CLI as native executables and a container image. Release calls this for a tag. Run it by hand
# (Actions > CLI release > Run workflow) to rehearse a release: it builds every binary and pushes the image under
# the given tags only, such as dry-run, and publishes nothing to any package registry or GitHub release.

on:
  workflow_call:
    inputs:
      version:
        description: Version in the archive names, such as 0.3.0.
        required: true
        type: string
      image-tags:
        description: Space-separated tags for ghcr.io/gokhanertogan/runsignal, such as "0.3.0 latest".
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version in the archive names.
        required: true
        default: 0.0.0-dry-run
        type: string
      image-tags:
        description: Space-separated image tags. Never latest or a real version in a rehearsal.
        required: true
        default: dry-run
        type: string

permissions:
  contents: read
  packages: write

jobs:
  cli-linux:
    name: CLI for Linux (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - { arch: x64, platform: linux/amd64, runner: ubuntu-24.04 }
          - { arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Built natively on each architecture: native AOT does not cross-compile between Linux architectures without a
      # sysroot. The image is pushed by digest and tagged once both exist (cli-image).
      - id: build
        uses: docker/build-push-action@v6
        with:
          file: src/RunSignal.Cli/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
          outputs: type=image,name=ghcr.io/gokhanertogan/runsignal,push-by-digest=true,name-canonical=true,push=true
      - name: Keep the digest and take the binaries out of the image
        run: |
          mkdir -p digests dist glibc musl
          touch "digests/${DIGEST#sha256:}"
          id=$(docker create "ghcr.io/gokhanertogan/runsignal@$DIGEST")
          docker cp "$id:/runsignal" glibc/runsignal
          docker cp "$id:/runsignal-musl" musl/runsignal
          docker rm "$id"
          ./glibc/runsignal --help > /dev/null
          version="${{ inputs.version }}"
          tar -czf "dist/runsignal-$version-linux-${{ matrix.arch }}.tar.gz" -C glibc runsignal
          tar -czf "dist/runsignal-$version-linux-musl-${{ matrix.arch }}.tar.gz" -C musl runsignal
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
      - uses: actions/upload-artifact@v4
        with:
          name: cli-linux-${{ matrix.arch }}
          path: dist/*.tar.gz

  cli-image:
    name: CLI image
    needs: cli-linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tag both architectures as one image
        working-directory: digests
        run: |
          image=ghcr.io/gokhanertogan/runsignal
          tags=()
          for tag in $IMAGE_TAGS; do tags+=(-t "$image:$tag"); done
          # One argument per digest file name.
          # shellcheck disable=SC2046
          docker buildx imagetools create "${tags[@]}" $(printf "$image@sha256:%s " *)
          for tag in $IMAGE_TAGS; do docker buildx imagetools inspect "$image:$tag"; done
        env:
          IMAGE_TAGS: ${{ inputs.image-tags }}

  cli-native:
    name: CLI for ${{ matrix.rid }}
    strategy:
      matrix:
        include:
          - { rid: osx-arm64, runner: macos-15, archive: tar.gz }
          - { rid: osx-x64, runner: macos-15, archive: tar.gz, cross: true }
          - { rid: win-x64, runner: windows-2025, archive: zip }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      # The latest 10.0 SDK: the self-contained binary embeds its runtime, so it must be the patched one.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish src/RunSignal.Cli -c Release -r ${{ matrix.rid }} -p:RunSignalNative=true -o out
      - if: ${{ !matrix.cross }}
        run: ./out/runsignal --help
        shell: bash
      - name: Archive
        shell: bash
        run: |
          name="runsignal-${{ inputs.version }}-${{ matrix.rid }}"
          mkdir dist
          if [ "${{ matrix.archive }}" = zip ]; then
            (cd out && 7z a "../dist/$name.zip" runsignal.exe)
          else
            tar -czf "dist/$name.tar.gz" -C out runsignal
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.rid }}
          path: dist/*
