[package]
name = "runsignal"
version = "0.2.0"
edition = "2021"
rust-version = "1.75.0"
description = "Cron job and background job monitoring with OpenTelemetry: alert on missed, failed, overrunning, stalled or low-output scheduled jobs, consumers and pipelines, in New Relic, Prometheus and Grafana."
license = "MIT"
repository = "https://github.com/gokhanertogan/RunSignal"
homepage = "https://github.com/gokhanertogan/RunSignal"
documentation = "https://docs.rs/runsignal"
readme = "README.md"
# Reads ../../spec, which is not part of the published crate.
exclude = ["tests/conformance.rs"]
keywords = ["observability", "opentelemetry", "monitoring", "cron", "alerting"]
categories = ["development-tools::debugging", "development-tools::profiling", "asynchronous"]

[dependencies]
opentelemetry = { version = "0.33.1", default-features = false, features = ["metrics", "trace"] }
unicode-normalization = "0.1.26"

[dev-dependencies]
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "metrics", "reqwest-blocking-client", "reqwest-rustls"] }
opentelemetry_sdk = { version = "0.33.1", features = ["metrics", "trace", "testing"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }
