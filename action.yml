name: RunSignal alerts for background jobs
description: "Alerts for cron jobs and background workers: provision New Relic alerts or export Prometheus rules and Grafana dashboards."
author: Gokhan Ertogan
branding:
  icon: bell
  color: orange

inputs:
  command:
    description: >-
      The runsignal command and its arguments, such as
      "provision runsignal.json --account-id 1234567 --region EU" or "export prometheus runsignal.json -o rules.yml".
    required: false
    default: ''
  pr-comment:
    description: >-
      Manifest paths, separated by spaces. On a pull request, comment with the alerts the change adds, removes or
      changes (against the base branch) and the validation findings, updating the same comment on every push.
      Fails the step when a manifest has errors. Needs "pull-requests: write" permission.
    required: false
    default: ''
  github-token:
    description: The token used to comment on the pull request.
    required: false
    default: ${{ github.token }}
  version:
    description: The RunSignal.Cli version to install. Defaults to the latest release.
    required: false
    default: ''
  cli-path:
    description: A runsignal executable to use instead of installing RunSignal.Cli, such as one built in an earlier step.
    required: false
    default: ''
  new-relic-api-key:
    description: A New Relic User API key, for plan, diff, provision and destroy. Pass it from a secret.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - if: inputs.cli-path == ''
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x
    - name: Install the runsignal CLI
      if: inputs.cli-path == ''
      shell: bash
      env:
        RUNSIGNAL_VERSION: ${{ inputs.version }}
      run: dotnet tool install --global RunSignal.Cli ${RUNSIGNAL_VERSION:+--version "$RUNSIGNAL_VERSION"}
    - name: runsignal ${{ inputs.command }}
      if: inputs.command != ''
      shell: bash
      env:
        NEW_RELIC_API_KEY: ${{ inputs.new-relic-api-key || env.NEW_RELIC_API_KEY }}
        RUNSIGNAL_COMMAND: ${{ inputs.command }}
        RUNSIGNAL: ${{ inputs.cli-path || 'runsignal' }}
      # Word splitting is intended: the input is a command line.
      run: $RUNSIGNAL $RUNSIGNAL_COMMAND
    - name: Comment on the pull request with the alert changes
      if: inputs.pr-comment != '' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        MANIFESTS: ${{ inputs.pr-comment }}
        BASE_REF: ${{ github.base_ref }}
        PR: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        REPO: ${{ github.repository }}
        RUNSIGNAL: ${{ inputs.cli-path || 'runsignal' }}
      run: |
        marker='<!-- runsignal-pr-comment -->'
        base_dir="$RUNNER_TEMP/runsignal-base"
        mkdir -p "$base_dir"
        # The base branch's version of each manifest; a manifest new in this pull request has none.
        git fetch --quiet --no-tags --depth=1 origin "$BASE_REF"
        bases=()
        read -ra files <<< "$MANIFESTS"
        for manifest in "${files[@]}"; do
          base="$base_dir/$(printf '%s' "$manifest" | tr '/' '_')"
          if git show "FETCH_HEAD:$manifest" > "$base" 2>/dev/null; then bases+=(--base "$base"); fi
        done

        {
          echo "$marker"
          "$RUNSIGNAL" compare "${files[@]}" "${bases[@]}" --markdown
          echo
          echo "<sub>Generated by [RunSignal](https://github.com/gokhanertogan/RunSignal) for ${HEAD_SHA:0:7}.</sub>"
        } > "$RUNNER_TEMP/runsignal-comment.md"
        cat "$RUNNER_TEMP/runsignal-comment.md" >> "$GITHUB_STEP_SUMMARY"

        # One comment per pull request, updated on every push.
        existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
        if [ -n "$existing" ]; then
          gh api --method PATCH "repos/$REPO/issues/comments/$existing" -F "body=@$RUNNER_TEMP/runsignal-comment.md" > /dev/null
        else
          gh api --method POST "repos/$REPO/issues/$PR/comments" -F "body=@$RUNNER_TEMP/runsignal-comment.md" > /dev/null
        fi

        # Errors fail the check after the comment is written, so the pull request shows both.
        "$RUNSIGNAL" validate "${files[@]}" > /dev/null
